syntax = "proto3";

package user;

option go_package = "github.com/chetansachan/socialflow/proto";

service UserService {
    rpc Register(RegisterUserRequest) returns (RegisterUserResponse);
    rpc GetUserById(GetUserByIdRequest) returns (GetUserByIdResponse);
    rpc GetUserByEmail(GetUserByEmailRequest) returns (GetUserByEmailResponse);
    rpc GetUserByUsername(GetUserByUsernameRequest) returns (GetUserByUsernameResponse);
    rpc BatchGetUsers(BatchGetUsersRequest) returns (BatchGetUsersResponse);
    rpc Login(LoginRequest) returns (LoginResponse);
    rpc Refresh(RefreshTknRequest) returns (RefreshTknResponse);
    rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse);
    rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);
    rpc SearchUsers(SearchUsersRequest) returns (SearchUsersResponse);
}

message User {
    string id = 1;
    string username = 2;
    string name = 3;
    string email = 4;
    bool is_public = 5;
    string created_at = 6;
    string updated_at = 7;
}

message RegisterUserRequest {
    string username = 1;
    string name = 2;
    string email = 3;
    string password = 4;
    optional bool is_public = 5;
}

message RegisterUserResponse {
    User user = 1;
}


message GetUserByIdRequest {
    string id = 1;
}

message GetUserByIdResponse {
    User user = 1;
}

message GetUserByEmailRequest {
    string email = 1;
}

message GetUserByEmailResponse {
    User user = 1;
}

message GetUserByUsernameRequest {
    string username = 1;
}

message GetUserByUsernameResponse {
    User user = 1;
}

message BatchGetUsersRequest {
    repeated string ids = 1;
}

message BatchGetUsersResponse {
    repeated User users = 1;
}

message LoginRequest {
    string email = 1;
    string password = 2;
}

message LoginResponse {
    string access_tkn = 1;
    string refresh_tkn = 2;
    string message = 3;
}

message RefreshTkn {
	string  id    = 1;
	string  userId  = 2;
	string  token    = 3;
	bool    is_revoked = 4;
	string  expires_at = 5;
	string  created_at = 6;
	string  updated_at = 7;
}

message RefreshTknRequest {
    string refreshtkn = 1;
}

message RefreshTknResponse {
    string new_access_tkn = 1;
    string new_refresh_tkn = 2;
}

message UpdateUserResponse {
    User user = 1;
}

message UpdateUserRequest {
    string id = 1;
    optional string username = 2;
    optional string name = 3;
    optional string email = 4;
    optional string password = 5;
    optional bool is_public = 6;
}

message DeleteUserRequest {
    string id = 1;
}

message DeleteUserResponse {
    string message = 1;
}

message SearchUsersRequest {
    // Username prefix or display-name keywords.
    string query = 1;
    int32 limit = 2;
}

message SearchUsersResponse {
    // Exact username matches first, then prefix matches, then fuzzy matches.
    repeated User users = 1;
}