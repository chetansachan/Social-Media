syntax = "proto3";

package follow;

option go_package = "github.com/chetansachan/socialflow/proto";

service FollowService {
    rpc FollowUser(FollowUserRequest) returns (FollowUserResponse);
    rpc UnfollowUser(UnfollowUserRequest) returns (UnfollowUserResponse);
    rpc GetFollowers(GetFollowersRequest) returns (GetFollowersResponse);
    rpc GetFollowing(GetFollowingRequest) returns (GetFollowingResponse);
    rpc GetFollowCounts(GetFollowCountsRequest) returns (GetFollowCountsResponse);
    rpc GetFollowStatus(GetFollowStatusRequest) returns (GetFollowStatusResponse);
    rpc RemoveFollower(RemoveFollowerRequest) returns (RemoveFollowerResponse);
}

message FollowUserRequest {
    string follower_id = 1;
    string following_id = 2;
}

message FollowUserResponse {
    string message = 1;
}

message UnfollowUserRequest {
    string follower_id = 1;
    string following_id = 2;
}

message UnfollowUserResponse {
    string message = 1;
}

message GetFollowersRequest {
    string user_id = 1;
}

message GetFollowersResponse {
    repeated string follower_ids = 1;
}

message GetFollowingRequest {
    string user_id = 1;
}

message GetFollowingResponse {
    repeated string following_ids = 1;
}

message GetFollowCountsRequest {
    string user_id = 1;
}

message GetFollowCountsResponse {
    int32 followers_count = 1;
    int32 following_count = 2;
}

message GetFollowStatusRequest {
    string follower_id = 1;
    string following_id = 2;
}

message GetFollowStatusResponse {
    bool is_following = 1;
}

message RemoveFollowerRequest {
    string user_id = 1;
    string follower_id = 2;
}

message RemoveFollowerResponse {
    string message = 1;
}
