syntax = "proto3";

package feed;

option go_package = "github.com/chetansachan/socialflow/proto";

service FeedService {
    rpc GetFeed(GetFeedRequest) returns (GetFeedResponse);
    rpc InvalidateUserFeed(InvalidateUserFeedRequest) returns (InvalidateUserFeedResponse);
}

message FeedPost {
    string id = 1;
    string author_id = 2;
    string content = 3;
    string media_url = 4;
    bool is_public = 5;
    int32 like_count = 6;
    string created_at = 7;
    string updated_at = 8;
}

message GetFeedRequest {
    string user_id = 1;
    int32 page_size = 2;
    string cursor = 3;
}

message GetFeedResponse {
    repeated FeedPost posts = 1;
    string next_cursor = 2;
    bool has_more = 3;
}

message InvalidateUserFeedRequest {
    string user_id = 1;
}

message InvalidateUserFeedResponse {
    bool success = 1;
}
