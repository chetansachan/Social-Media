events {}

http {
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    # Path to save the log file using the 'main' format
    access_log logs/access.log main;
    error_log logs/error.log debug;

    upstream api_gateway {
    least_conn;

    server 127.0.0.1:8080 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:8081 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:8082 backup max_fails=3 fail_timeout=10s;
}
    
    server {
        # Nginx listens on port 80 (IPv4 and IPv6) for incoming web traffic
        listen       80;
        listen       [::]:80;
        server_name  localhost;

        location / {
        # Forward all traffic to your Go application running on port 8080
        proxy_pass http://api_gateway;
        
        # Pass original request headers to Go
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
