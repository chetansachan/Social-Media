events {}

http {
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    # Path to save the log file using the 'main' format
    access_log logs/access.log main;
    error_log logs/error.log debug;

    upstream api_gateway {
    least_conn;

    server 127.0.0.1:8080 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:8081 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:8082 backup max_fails=3 fail_timeout=10s;
}
    
    server {
        # Nginx listens on port 80 (IPv4 and IPv6) for incoming web traffic
        listen       80;
        listen       [::]:80;
        server_name  localhost;

    location /query {
        # GraphQL transport: POST for queries and mutations, GET for the
        # WebSocket upgrade the subscriptions use.
        proxy_pass http://api_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /playground {
        proxy_pass http://api_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The SPA shell. Any path the frontend routes must fall back to index.html
    # so a deep link does not 404 on a hard refresh.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
