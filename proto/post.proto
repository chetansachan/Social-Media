syntax = "proto3";

package post;

option go_package = "github.com/chetansachan/socialflow/proto";

service PostService{
    rpc CreatePost(CreatePostRequest) returns (CreatePostResponse);
    rpc GetPostById(PostByIdRequest) returns (PostByIdResponse);
    rpc DeletePost(DeletePostRequest) returns (DeletePostResponse);
    rpc UpdatePost(UpdatePostRequest) returns (UpdatePostResponse);
    rpc MovePostToArchived(MovePostToArchivedRequest) returns (MovePostToArchivedResponse);
    rpc GetArchivedPostById(ArchivedPostByIdRequest) returns (ArchivedPostByIdResponse);
    rpc GetAllArchivedPosts(AllArchivedPostRequest) returns (AllArchivedPostResponse);
    rpc GetAllPosts(AllPostRequest) returns (AllPostResponse);
    rpc LikePost(LikePostRequest) returns (LikePostResponse);
    rpc GetAllPostLikers(GetAllPostLikersRequest) returns (GetAllPostLikersResponse);
    rpc GetAllLikedPosts(GetAllLikedPostsRequest) returns (GetAllLikedPostsResponse);
    rpc GetLikeStates(GetLikeStatesRequest) returns (GetLikeStatesResponse);
    rpc GetUploadSignature(GetUploadSignatureRequest) returns (GetUploadSignatureResponse);
    rpc SearchPosts(SearchPostsRequest) returns (SearchPostsResponse);
}

message Post {
    string id = 1;
    string author_id = 2;
    string content = 3;
    string media_url = 4;
    bool is_public = 5;
    int32 like_count = 6;
    string created_at = 7;
    string updated_at = 8;
}

message PostByIdRequest {
    string id = 1;
}

message PostByIdResponse {
    Post post = 1;
}

message DeletePostRequest {
    string post_id = 1;
    string author_id = 2;
}

message DeletePostResponse {
    string message = 1;
}

message CreatePostRequest {
    string author_id = 2;
    string content = 3;
    string media_url = 4;
    optional bool is_public = 5;
}

message CreatePostResponse {
    Post post = 1;
}

message UpdatePostRequest {
    string post_id = 1;
    string author_id = 2;
    optional string content = 3;
    optional bool is_public = 4;
}

message UpdatePostResponse {
    Post post = 1;
}

message ArchivedPostByIdRequest {
    string id = 1;
}

message ArchivedPostByIdResponse {
    Post post = 1;
}

message MovePostToArchivedRequest {
    string post_id = 1;
    string author_id = 2;
}

message MovePostToArchivedResponse {
    string message = 1;
}

message AllArchivedPostRequest {
    string author_id = 1;
}

message AllArchivedPostResponse {
    repeated Post post = 1;
}

message AllPostRequest {
    string author_id = 1;
}

message AllPostResponse {
    repeated Post post = 1;
}

message LikePostRequest {
    string post_id = 1;
    string user_id = 2;
}

message LikePostResponse {
    bool is_liked = 1;
    string message = 2;
}

message GetAllPostLikersRequest {
    string post_id = 1;
}

message GetAllPostLikersResponse {
    repeated string user_ids = 1;
}

message GetAllLikedPostsRequest {
    string user_id = 1;
}

message GetAllLikedPostsResponse {
    repeated Post post = 1;
}

message GetLikeStatesRequest {
    string user_id = 1;
    repeated string post_ids = 2;
}

message GetLikeStatesResponse {
    map<string, bool> liked = 1;
}

message GetUploadSignatureRequest {
    string user_id = 1;
    string resource_type = 2;
    string folder = 3;
}

message GetUploadSignatureResponse {
    string cloud_name = 1;
    string api_key = 2;
    int64 timestamp = 3;
    string signature = 4;
    string folder = 5;
    string public_id = 6;
    string upload_url = 7;
    int64 expires_at = 8;
}

message SearchPostsRequest {
    // Plain keywords or hashtags such as "#golang".
    string query = 1;
    int32 limit = 2;
}

message SearchPostsResponse {
    // Ranked matches, best first. Public, non-deleted posts only.
    repeated Post posts = 1;
}