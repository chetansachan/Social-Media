syntax = "proto3";

package post;

option go_package = "github.com/chetansachan/socialflow/proto";

service PostService{
    rpc CreatePost(CreatePostRequest) returns (CreatePostResponse);
    rpc GetPostById(PostByIdRequest) returns (PostByIdResponse);
    rpc DeletePost(DeletePostRequest) returns (DeletePostResponse);
    rpc UpdatePost(UpdatePostRequest) returns (UpdatePostResponse);
    rpc MovePostToArchived(MovePostToArchivedRequest) returns (MovePostToArchivedResponse);
    rpc GetArchivedPostById(ArchivedPostByIdRequest) returns (ArchivedPostByIdResponse);
    rpc GetAllArchivedPosts(AllArchivedPostRequest) returns (AllArchivedPostResponse);
    rpc GetAllPosts(AllPostRequest) returns (AllPostResponse);
}

message Post {
    string id = 1;
    string author_id = 2;
    string content = 3;
    string media_url = 4;
    bool is_public = 5;
    int32 like_count = 6;
    string created_at = 7;
    string updated_at = 8;
}

message PostByIdRequest {
    string id = 1;
}

message PostByIdResponse {
    Post post = 1;
}

message DeletePostRequest {
    string post_id = 1;
}

message DeletePostResponse {
    string message = 1;
}

message CreatePostRequest {
    string author_id = 2;
    string content = 3;
    string media_url = 4;
    optional bool is_public = 5;
}

message CreatePostResponse {
    Post post = 1;
}

message UpdatePostRequest {
    string post_id = 1;
    string author_id = 2;
    optional string content = 3;
    optional bool is_public = 4;
}

message UpdatePostResponse {
    Post post = 1;
}

message ArchivedPostByIdRequest {
    string id = 1;
}

message ArchivedPostByIdResponse {
    Post post = 1;
}

message MovePostToArchivedRequest {
    string post_id = 1;
}

message MovePostToArchivedResponse {
    string message = 1;
}

message AllArchivedPostRequest {
    string author_id = 1;
}

message AllArchivedPostResponse {
    repeated Post post = 1;
}

message AllPostRequest {
    string author_id = 1;
}

message AllPostResponse {
    repeated Post post = 1;
}