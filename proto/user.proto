syntax = "proto3";

package user;

option go_package = "github.com/chetansachan/socialflow/proto";

service UserService {
    rpc Register(RegisterUserRequest) returns (RegisterUserResponse);
}

message RegisterUserRequest {
    string username = 1;
	string name = 2;
	string email = 3;
	string password = 4;
}

message RegisterUserResponse {
    string id = 1;
    string username = 2;
    string name = 3;
    string email = 4;
    bool is_public = 5;
}
