syntax = "proto3";

package comment;

option go_package = "github.com/chetansachan/socialflow/proto";

// CommentService owns threaded comments on posts. It runs inside post-service
// so a comment, its counters, and its outbox event commit in one transaction
// with the post row it references.
service CommentService {
    rpc CreateComment(CreateCommentRequest) returns (CreateCommentResponse);
    rpc GetComment(GetCommentRequest) returns (GetCommentResponse);
    rpc ListComments(ListCommentsRequest) returns (ListCommentsResponse);
    rpc UpdateComment(UpdateCommentRequest) returns (UpdateCommentResponse);
    rpc DeleteComment(DeleteCommentRequest) returns (DeleteCommentResponse);
    rpc LikeComment(LikeCommentRequest) returns (LikeCommentResponse);
    rpc GetCommentLikeStates(GetCommentLikeStatesRequest) returns (GetCommentLikeStatesResponse);
}

message Comment {
    string id = 1;
    string post_id = 2;
    string author_id = 3;
    // parent_id is empty for a top-level comment.
    string parent_id = 4;
    string content = 5;
    int32 like_count = 6;
    int32 reply_count = 7;
    // depth is 0 for a top-level comment and increments per reply.
    int32 depth = 8;
    bool is_deleted = 9;
    string created_at = 10;
    string updated_at = 11;
}

message CreateCommentRequest {
    string post_id = 1;
    string author_id = 2;
    string parent_id = 3;
    string content = 4;
}

message CreateCommentResponse {
    Comment comment = 1;
}

message GetCommentRequest {
    string id = 1;
}

message GetCommentResponse {
    Comment comment = 1;
}

message ListCommentsRequest {
    string post_id = 1;
    // parent_id selects replies to one comment. Empty lists top-level comments.
    string parent_id = 2;
    int32 limit = 3;
    // cursor is the opaque next_cursor returned by the previous page.
    string cursor = 4;
}

message ListCommentsResponse {
    repeated Comment comments = 1;
    string next_cursor = 2;
    bool has_more = 3;
}

message UpdateCommentRequest {
    string comment_id = 1;
    string author_id = 2;
    string content = 3;
}

message UpdateCommentResponse {
    Comment comment = 1;
}

message DeleteCommentRequest {
    string comment_id = 1;
    string author_id = 2;
}

message DeleteCommentResponse {
    string message = 1;
}

message LikeCommentRequest {
    string comment_id = 1;
    string user_id = 2;
}

message LikeCommentResponse {
    bool is_liked = 1;
    string message = 2;
}

message GetCommentLikeStatesRequest {
    string user_id = 1;
    repeated string comment_ids = 2;
}

message GetCommentLikeStatesResponse {
    map<string, bool> liked = 1;
}
