  namespace: socialflow
  labels:
    app.kubernetes.io/name: chat-service
    app.kubernetes.io/part-of: socialflow
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: chat-service
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      # A membership check precedes every read, so a quiet chat hour is a load
      # drop rather than a failure signal.
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
