apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: socialflow
  labels:
    app.kubernetes.io/name: notification-service
    app.kubernetes.io/part-of: socialflow
spec:
  replicas: 2
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 300
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: notification-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notification-service
        app.kubernetes.io/part-of: socialflow
    spec:
      # The process closes live WebSockets, stops both servers, then waits for
      # the push and email worker pools. 45 seconds leaves slack for that.
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: notification-service
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: notification-service
      containers:
        - name: notification-service
          image: socialflow/notification-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 50055
            - name: websocket
              containerPort: 8085
            - name: admin
              containerPort: 9095
          envFrom:
            - configMapRef:
                name: socialflow-config
            - secretRef:
                name: socialflow-secrets
                optional: true
          env:
            - name: PORT
              value: "50055"
            - name: WS_PORT
              value: "8085"
            - name: ADMIN_PORT
              value: "9095"
            - name: EVENT_GROUP
              value: notification-service
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: socialflow-secrets
                  key: notifications-database-url
            - name: DATABASE_READ_URL
              valueFrom:
                secretKeyRef:
                  name: socialflow-secrets
                  key: notifications-database-read-url
                  optional: true
            # The WebSocket handshake validates the same access token the
            # gateway accepts.
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: socialflow-secrets
                  key: jwt-secret
            # Swap these for fcm/apns and smtp once credentials are mounted.
            - name: PUSH_PROVIDER
              value: log
            - name: EMAIL_PROVIDER
              value: log
          startupProbe:
            httpGet:
              path: /healthz
              port: admin
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: admin
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /readyz
              port: admin
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: socialflow
  labels:
    app.kubernetes.io/name: notification-service
    app.kubernetes.io/part-of: socialflow
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: notification-service
  ports:
    - name: grpc
      port: 50055
      targetPort: grpc
      protocol: TCP
    - name: websocket
      port: 8085
      targetPort: websocket
      protocol: TCP
