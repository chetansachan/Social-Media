# Template only. Do not apply this file with real credentials and do not commit
# a filled-in copy. In a real cluster use External Secrets, Sealed Secrets, or
# the cloud provider's secret manager and point the Deployments at the resulting
# Secret name (`socialflow-secrets` by default).
#
#   kubectl -n socialflow create secret generic socialflow-secrets \
#     --from-literal=jwt-secret="$(openssl rand -hex 32)" \
#     --from-literal=users-database-url="postgres://..." \
#     ...
#
# Every database-backed service uses its own database, so each URL is a
# separate key. The read URL is optional: omit the key and the Deployment falls
# back to the primary.
apiVersion: v1
kind: Secret
metadata:
  name: socialflow-secrets
  namespace: socialflow
  labels:
    app.kubernetes.io/part-of: socialflow
type: Opaque
stringData:
  # HS256 signing key. user-service signs with it and api-gateway plus
  # notification-service validate with it.
  jwt-secret: replace-with-at-least-32-random-bytes

  redis-password: ""

  users-database-url: postgres://socialflow:replace-me@pgbouncer-writer:6432/socialflow_users?sslmode=require
  users-database-read-url: postgres://socialflow:replace-me@pgbouncer-reader:6432/socialflow_users?sslmode=require

  posts-database-url: postgres://socialflow:replace-me@pgbouncer-writer:6432/socialflow_posts?sslmode=require
  posts-database-read-url: postgres://socialflow:replace-me@pgbouncer-reader:6432/socialflow_posts?sslmode=require

  follows-database-url: postgres://socialflow:replace-me@pgbouncer-writer:6432/socialflow_follows?sslmode=require
  follows-database-read-url: postgres://socialflow:replace-me@pgbouncer-reader:6432/socialflow_follows?sslmode=require

  notifications-database-url: postgres://socialflow:replace-me@pgbouncer-writer:6432/socialflow_notifications?sslmode=require
  notifications-database-read-url: postgres://socialflow:replace-me@pgbouncer-reader:6432/socialflow_notifications?sslmode=require

  # post-service signs direct client uploads with these parameters.
  cloudinary-url: cloudinary://key:secret@cloud-name

  # Batch email delivery. Remove EMAIL_PROVIDER=smtp from the Deployment until
  # these are real; the service falls back to the log provider otherwise.
  smtp-password: ""
