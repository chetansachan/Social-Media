; PgBouncer configuration for SocialFlow.
;
; Run one instance in front of the primary (writes) and another in front of the
; read replica. Services then point:
;
;   DATABASE_URL      -> writer pooler
;   DATABASE_READ_URL -> reader pooler
;
; Transaction pooling keeps thousands of application connections down to a
; small number of PostgreSQL backends. The services already use pgx's unnamed
; statement mode, so no prepared statement survives a checkout and transaction
; pooling is safe.
;
; Copy this file to /etc/pgbouncer/pgbouncer.ini, copy
; databases.writer.ini.example (or databases.reader.ini.example) to
; /etc/pgbouncer/databases.ini, and generate userlist.txt from
; userlist.txt.example.

[databases]
%include /etc/pgbouncer/databases.ini

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir = /var/run/postgresql

; scram-sha-256 matches PostgreSQL 14+ defaults. The userlist stores the same
; SCRAM verifier PostgreSQL holds, so no plaintext password is needed here.
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

; Transaction pooling is required for the read/write split. Session-level
; features (advisory locks, LISTEN/NOTIFY, named prepared statements) are not
; compatible and are not used by these services.
pool_mode = transaction

max_client_conn = 5000
default_pool_size = 50
min_pool_size = 5
reserve_pool_size = 10
reserve_pool_timeout = 3

; Recycle backends before PostgreSQL or a load balancer drops them.
server_idle_timeout = 60
server_lifetime = 3600
server_connect_timeout = 5
query_wait_timeout = 30

; A crashed backend should fail the in-flight transaction; the service retries
; at the request level. Do not silently replay a write.
server_reset_query = DISCARD ALL
server_reset_query_always = 0

; Application-level details.
ignore_startup_parameters = extra_float_digits,options
application_name_add_host = 1

; Observability: `SHOW STATS`, `SHOW POOLS`, and `SHOW DATABASES` are exposed on
; the admin console. Keep it on localhost inside the pod.
admin_users = pgbouncer_admin
stats_users = pgbouncer_stats

log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
verbose = 0
